<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3d6b4f" />
    <title>Offline</title>
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: #f6f4ef;
        color: #1c1917;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      img {
        width: 84px;
        height: 84px;
      }
      h1 {
        margin: 18px 0 6px;
        font-size: 26px;
      }
      p {
        margin: 0 0 22px;
        color: #78716c;
      }
      button {
        padding: 12px 28px;
        border: 0;
        border-radius: 12px;
        background: #3d6b4f;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" />
      <h1>You’re offline</h1>
      <p>The inventory needs a connection to its server.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
