name: Feature request
description: An idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do **not** include tokens, credentials, API keys, or real inventory data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like Household Inventory to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inventory web UI
        - Inventory API / SQLite
        - Gemini / photo add
        - Import / export
        - Deploy
        - Docs
        - Other
