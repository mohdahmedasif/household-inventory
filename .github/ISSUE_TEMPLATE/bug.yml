name: Bug report
description: Something is broken or unexpected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** paste Gemini keys, API keys, or real inventory rows.
        Use a made-up example if you need to show a path or item.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Node.js version
      placeholder: "20"
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: UI path, browser, or error text (secrets redacted).
